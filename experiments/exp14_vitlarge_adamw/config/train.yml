# =============================================================================
# exp14_vitlarge_adamw
# ViT-Large + UAM_Unified + AdamW + Cosine LR + CJ + RPT
# Changes from exp13:
#   1. AdamW optimizer, LR=2e-5
#   2. Cosine LR (t_initial=120, warmup 5 epochs, lr_min=0.02*BASE_LR)
#   3. Color Jitter ON
#   4. Random Patch ON (prob=0.5)
#   5. LGT OFF
#   6. Weight decay should be 1e-4 but used 0.01
#   7. 60 epochs, save every 5
# BATCH SIZE CHANGED FROM 32 TO 24
# =============================================================================
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/model'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  #PC_LOSS: False

INPUT:
  SIZE_TRAIN: [320, 192] # 256, 128 baseline -> 320, 192
  SIZE_TEST: [320, 192] # 256, 128 baseline -> 320, 192
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT:
    DO_LGT: False
    PROB: 0.5
  CJ:
    ENABLED: True
    PROB: 0.5 #1.0 default is wrong
    BRIGHTNESS: 0.15
    CONTRAST: 0.15
    SATURATION: 0.1
    HUE: 0.1
  RPT:
    ENABLED: True
    PROB: 0.5

DATASETS:
  TRAIN: ('UrbanElementsReID', 'UAM_Unified')
  TEST: ('UrbanElementsReID',)
  ROOT_DIR: '/media/DiscoLocal/IPCV/UE-ReID/urban-elements-re-id-challenge-2026/Urban2026/'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW' # AdamW -> SGD
  MAX_EPOCHS: 60
  BASE_LR: 0.00002 # 00002 -> 0.008
  IMS_PER_BATCH: 32
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 5
  WEIGHT_DECAY: 1e-4 # 0.01 or 1e-4
  WEIGHT_DECAY_BIAS: 0.0 # 1e-4
  BIAS_LR_FACTOR: 2
  STEPS: (40, 70)
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/models/exp14_vitlarge_adamw/part_attention_vit_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './exp14_vitlarge_adamw'