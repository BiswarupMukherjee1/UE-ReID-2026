# =============================================================================
# exp13_vitlarge_uam_unified
# ViT-Large + UAM_Unified (official organizer data) + LGT disabled
# 
# Key differences from exp06 (ViT-Large that scored 0.10696):
#   1. UAM_Unified instead of UrbAM — official data used by ALL top scorers
#   2. LGT: False — Aymen confirmed grayscale aug destroys color info
#   3. 30 epochs — Aymen's sweet spot for ViT-Large on this dataset size
#   4. STEPS: (40, 70) — LR never decays within 30 epochs (Aymen: "barely decayed")
#   5. CHECKPOINT_PERIOD: 5 — save every 5 epochs for ensemble later
# =============================================================================

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/model'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT:
    DO_LGT: False
    PROB: 0.5

DATASETS:
  TRAIN: ('UrbanElementsReID', 'UAM_Unified')
  TEST: ('UrbanElementsReID',)
  ROOT_DIR: '/media/DiscoLocal/IPCV/UE-ReID/urban-elements-re-id-challenge-2026/Urban2026/'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 0.008
  IMS_PER_BATCH: 32
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 5
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  STEPS: (40, 70)
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/models/exp13_vitlarge_uam_unified/part_attention_vit_60                  .pth'
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './exp13_vitlarge_uam_unified'
