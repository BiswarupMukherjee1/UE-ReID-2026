# =============================================================================
# exp16 config — view embeddings + camera equalization + UAM query/test
#
# Changes from exp15:
#   1. LOG_NAME updated to exp16
#   2. PC_LOSS: True (kept from exp15)
#   3. No DANN — see dann_components.py is NOT imported
#   4. Sampler replaced in train_exp16.py (not in config)
#   5. UAM_Unified now reads query+test splits (code change, not config)
#
# Same hyperparameters as exp15:
#   SGD lr=0.008, 60 epochs, batch=32, NUM_INSTANCE=4
#   CJ + RPT augmentations ON
#   LGT OFF
# =============================================================================
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/model'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  PC_LOSS: True

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  REA:
    ENABLED: False
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  LGT:
    DO_LGT: False
    PROB: 0.5
  CJ:
    ENABLED: True
    PROB: 0.5
    BRIGHTNESS: 0.15
    CONTRAST: 0.15
    SATURATION: 0.1
    HUE: 0.1
  RPT:
    ENABLED: True
    PROB: 0.5

DATASETS:
  TRAIN: ('UrbanElementsReID', 'UAM_Unified')
  TEST: ('UrbanElementsReID',)
  ROOT_DIR: '/media/DiscoLocal/IPCV/UE-ReID/urban-elements-re-id-challenge-2026/Urban2026/'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 60
  BASE_LR: 0.008
  IMS_PER_BATCH: 32
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 60
  EVAL_PERIOD: 5
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 0.0
  BIAS_LR_FACTOR: 2
  STEPS: (40, 70)
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './exp16_viewemb_equalized'