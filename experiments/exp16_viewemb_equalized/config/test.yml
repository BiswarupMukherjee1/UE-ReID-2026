# =============================================================================
# exp16 test config — used by update_exp16.py
# Set TEST.WEIGHT to the checkpoint you want to evaluate.
# =============================================================================
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/media/DiscoLocal/IPCV/UE-ReID/Part-Aware-Transformer-main/model'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_large_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  PC_LOSS: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  TRAIN: ('UrbanElementsReID',)
  TEST: ('UrbanElementsReID',)
  ROOT_DIR: '/media/DiscoLocal/IPCV/UE-ReID/urban-elements-re-id-challenge-2026/Urban2026/'

DATALOADER:
  NUM_WORKERS: 8
  NUM_INSTANCE: 4

SOLVER:
  IMS_PER_BATCH: 32
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  # SET THIS to the checkpoint you want to evaluate, e.g.:
  # WEIGHT: 'models/./exp16_viewemb_equalized/part_attention_vit_40.pth'
  WEIGHT: 'models/./exp16_viewemb_equalized/part_attention_vit_40.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: True

LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: './exp16_viewemb_equalized'